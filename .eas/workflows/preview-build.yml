# Build nativo Android (perfil preview) al abrir/actualizar un PR hacia main.
# Docs: https://docs.expo.dev/eas/workflows/get-started/
#
# Ejecutar manual: eas workflow:run .eas/workflows/preview-build.yml

name: Preview — EAS Build Android (perfil preview)

on:
  workflow_dispatch:
    inputs:
      message:
        type: string
        required: false
        description: Mensaje del build (solo ejecución manual)
        default: "Preview build Android"
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  build_android:
    name: Android (preview)
    type: build
    params:
      platform: android
      profile: preview
      message: ${{ inputs.message || github.event.pull_request.title || github.commit_message || 'Preview build Android' }}
