# Publica OTA al canal preview en develop solo si el commit incluye "EAS update:".
# Docs: https://docs.expo.dev/eas/workflows/examples/publish-preview-update/
#
# Ejemplo de commit: EAS update: mejoras en búsqueda del almacén
#
# Ejecutar manual: eas workflow:run .eas/workflows/preview-update.yml

name: Preview — EAS Update (canal preview, Android)

on:
  push:
    branches:
      - develop
    paths:
      - "**"
      - "!**/*.md"
      - "!.cursor/**"
      - "!README.md"
  workflow_dispatch:
    inputs:
      message:
        type: string
        required: false
        description: Mensaje del update (solo ejecución manual)
        default: "Preview manual"

jobs:
  publish_preview_update:
    name: Publicar OTA Android (preview)
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.commit_message, 'EAS update:') }}
    type: update
    params:
      channel: preview
      platform: android
      message: ${{ inputs.message || github.commit_message || 'Preview update' }}
